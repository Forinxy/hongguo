plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'xyz.kejiyu.hongguo'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.kejiyu.hongguo'
        minSdk 29
        targetSdk 34
        versionCode 20260810
        versionName "1.0.0 (20260810)"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // 只保留中英文字符串资源，去掉依赖库的多语言资源（省体积）
        resConfigs("zh", "en")
    }

    buildFeatures {
        // 生成 BuildConfig，用于读取 VERSION_NAME 做更新对比
        buildConfig = true
    }

    // ============ 签名配置（从 keystore.properties 读取） ============
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasSigning = keystorePropsFile.exists() &&
        !keystoreProps.getProperty('storePassword', '').isBlank() && keystoreProps.getProperty('storePassword', '') != 'FILL_ME' &&
        !keystoreProps.getProperty('keyPassword', '').isBlank() && keystoreProps.getProperty('keyPassword', '') != 'FILL_ME'
    signingConfigs {
        release {
            storeFile file(keystoreProps.getProperty('storeFile', '/storage/emulated/0/1MT/keystore/hongguo.jks'))
            storePassword keystoreProps.getProperty('storePassword', '')
            keyAlias keystoreProps.getProperty('keyAlias', 'hongguo')
            keyPassword keystoreProps.getProperty('keyPassword', '')
        }
    }

    // ============ APK 瘦身：R8 代码压缩 + 资源收缩（debug/release 都开） ============
    buildTypes {
        debug {
            // 关键：AGP 对 debuggable=true 的包会禁用 R8 压缩/混淆！
            // 置为 false 后 assembleDebug 才会真正执行 minify/shrink，APK 才会变小
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 密码填好前先用 debug 签名；填好后 debug 也改用 hongguo 签名
            if (hasSigning) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    // ============ LSPosed API 102 关键配置 ============
    // 确保注解处理器生成的 META-INF/xposed/java_init.list
    // （模块入口注册文件）被合并进 APK，而不是被排除。
    // 如果不配这个，LSPosed 无法识别模块入口 → 模块不会加载！
    packaging {
        resources {
            merges += ['META-INF/xposed/*']
            excludes += ['**']
        }
    }
}

dependencies {
    // 零 AndroidX 实现依赖：界面是空的纯平台 Activity，所有 AndroidX 库都不打包
    // 体积只剩：模块自身 Hook 代码 + R8 裁剪后的 Kotlin 标准库

    // ============ LSPosed API 102 ============
    // compileOnly：编译期可见，运行时由 LSPosed 框架提供，不会打包进 APK
    compileOnly libs.libxposed.api
}
